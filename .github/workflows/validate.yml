name: Archival integrity validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify archival SHA-256 manifest
        run: |
          sha256sum --check checksums/REFERENCE_SHA256SUMS.txt

      - name: Validate repository structure and reference artifacts
        run: |
          python python/validate_repository.py
